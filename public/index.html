<!doctype html>
<html lang="es">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Libros</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>

      <header>

      <ul id="lista" class="lista"></ul>
    </main>

</html>
